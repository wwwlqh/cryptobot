[project]
name = "cryptobot"
version = "0.1.0"
description = "Polymarket 5m/15m crypto up/down trading bot with a live dashboard"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "httpx[http2]>=0.27",
    "websockets>=13.0,<16.0",
    "apscheduler>=3.10",
    "pytz>=2024.1",
    "tzlocal>=5.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "py-clob-client-v2>=1.0.1",
    "py-builder-relayer-client>=0.0.2rc1",
    "eth-abi>=5.0",
    "eth-utils>=4.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=15",
    "joblib>=1.3",
    # The shipped models are pickles; see polymarket/infra/requirements.runtime.txt
    # for the exact versions the live server pins.
    "scikit-learn>=1.4",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Research and backtesting extras (model search, charts).
research = [
    "optuna>=3.5",
    "numba>=0.59",
    "matplotlib>=3.8",
]

[project.scripts]
cbot-operator = "cryptobot.cli.operator:main"
cbot-live-go-no-go = "cryptobot.cli.live_go_no_go:main"
cbot-set-wallet-mode = "cryptobot.cli.set_wallet_mode:main"
cbot-env-parity = "cryptobot.cli.env_parity:main"
cbot-poly-wallet-diagnostics = "cryptobot_polymarket.wallet_diagnostics:main"
cbot-derive-poly-creds = "cryptobot_polymarket.derive_creds:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["polymarket/src"]
include = ["cryptobot*"]

[tool.pytest.ini_options]
testpaths = [
    "polymarket/src/cryptobot/tests",
    "polymarket/src/cryptobot_polymarket/tests",
    "polymarket/backtest/tests",
    "polymarket/backtest/training/tests",
    "polymarket/dashboard/tests",
]
pythonpath = [
    "polymarket/src",
    ".",
]
markers = [
    "slow: opt-in via -m slow; e.g. live 60s smoke",
]
# The root conftest.py keeps pytest's temp root inside the repo.
